# ============================================================
# Flutter ZIP → APK (GitHub Actions) — v3 (anti "base OK tapi CI error")
# Simpan sebagai: .github/workflows/build-flutter.yml
#
# Cocok dengan bot (Tirzz / Web2Apk):
#   inputs : jobId, userId, payload (JSON)
#   payload: appName, buildType, zipAssetId, zipAssetUrl, zipRepo, zipReleaseTag
#   artifact: apk-<jobId>
#
# Perbaikan utama dibanding versi sebelumnya:
#  1. Payload dibaca lewat ENV (bukan '...' di shell) → nama ZIP yang ada
#     tanda kutip ' / karakter aneh tidak lagi merusak step download.
#  2. Buang __MACOSX, .dart_tool, build, local.properties bawaan ZIP
#     (sisa build di laptop sering bikin error di CI).
#  3. pubspec.yaml dipilih yang paling dangkal (bukan sembarang hasil find).
#  4. Versi Flutter & Java menyesuaikan project (.fvmrc / batas Dart SDK /
#     versi Gradle wrapper), bukan selalu "stable" + Java 17.
#  5. key.properties yang hilang di CI otomatis dibuatkan (debug keystore),
#     jadi build release tidak gagal karena signing.
#  6. gradle.properties tidak lagi rusak (baris tanpa newline di akhir file).
#  7. --no-tree-shake-icons (penyebab klasik: debug jalan, release error).
#  8. flutter create memakai --project-name dari pubspec (nama folder CI
#     tidak valid sebagai nama package).
#  9. build_runner hanya jalan jika project memakainya & lognya terlihat.
# ============================================================
name: Flutter ZIP Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from bot'
        required: true
        type: string
      userId:
        description: 'Telegram user ID'
        required: true
        type: string
      payload:
        description: 'JSON payload from bot'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  # Payload diteruskan sebagai env → aman dari karakter ' " $ ` di appName
  PAYLOAD_JSON: ${{ inputs.payload }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------------------------
      # 1. Download ZIP dari GitHub Release
      # ----------------------------------------------------------
      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo PRIVATE & masih 404? ganti jadi: ${{ secrets.BUILD_PAT }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_JSON" > /tmp/payload.json

          pget() { node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/payload.json','utf8')); const v=p['$1']; console.log(v===undefined||v===null?'':v)"; }

          echo "=== Payload preview ==="
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/payload.json','utf8')); console.log(JSON.stringify({appName:p.appName,buildType:p.buildType,zipAssetId:p.zipAssetId,zipRepo:p.zipRepo,zipReleaseTag:p.zipReleaseTag,hasUrl:!!p.zipAssetUrl},null,2))"

          ASSET_ID=$(pget zipAssetId)
          REPO=$(pget zipRepo); REPO=${REPO:-$GITHUB_REPOSITORY}
          BROWSER_URL=$(pget zipAssetUrl)
          TAG=$(pget zipReleaseTag)
          echo "Repo=$REPO | AssetId=$ASSET_ID | Tag=$TAG"

          download_ok=0

          # Cara 1: API asset id
          if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "undefined" ] && [ "$ASSET_ID" != "null" ]; then
            echo "→ Download via API asset id..."
            if curl -fL --retry 3 --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o project.zip \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}"; then
              download_ok=1
            else
              echo "API asset id gagal, coba cara berikutnya..."
            fi
          fi

          # Cara 2: browser_download_url
          if [ "$download_ok" -eq 0 ] && [ -n "$BROWSER_URL" ] && [ "$BROWSER_URL" != "undefined" ]; then
            echo "→ Download via browser_download_url..."
            if curl -fL --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -o project.zip "$BROWSER_URL"; then
              download_ok=1
            else
              echo "browser_download_url gagal, coba cara berikutnya..."
            fi
          fi

          # Cara 3: gh release download
          if [ "$download_ok" -eq 0 ] && [ -n "$TAG" ] && [ "$TAG" != "undefined" ]; then
            echo "→ Download via gh release download tag=$TAG..."
            if gh release download "$TAG" --repo "$REPO" --pattern "*.zip" --dir . --clobber; then
              FIRST_ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
              if [ -n "$FIRST_ZIP" ] && [ "$FIRST_ZIP" != "project.zip" ]; then
                mv "$FIRST_ZIP" project.zip
              fi
              [ -f project.zip ] && download_ok=1
            fi
          fi

          if [ "$download_ok" -eq 0 ] || [ ! -f project.zip ]; then
            echo "ERROR: Gagal download project ZIP"
            exit 1
          fi

          ls -lh project.zip
          if ! unzip -tq project.zip >/dev/null 2>&1; then
            echo "ERROR: project.zip bukan ZIP valid. Isi awal file:"
            head -c 500 project.zip || true
            exit 1
          fi
          echo "ZIP valid ✓"

      # ----------------------------------------------------------
      # 2. Extract + bersihkan + cari root Flutter
      # ----------------------------------------------------------
      - name: Extract & prepare project
        run: |
          set -euo pipefail
          rm -rf project && mkdir -p project
          unzip -q project.zip -d project

          # Sampah dari macOS / Windows
          rm -rf project/__MACOSX
          find project -name '.DS_Store' -delete 2>/dev/null || true

          # Flatten kalau ZIP hanya berisi 1 folder di root
          DIRS=$(find project -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$DIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER=$(find project -mindepth 1 -maxdepth 1 -type d | head -1)
            echo "Flatten single root folder: $INNER"
            shopt -s dotglob
            mv "$INNER"/* project/ 2>/dev/null || true
            rmdir "$INNER" 2>/dev/null || true
            shopt -u dotglob
          fi

          # pubspec.yaml paling dangkal (abaikan example/, build/, dll)
          PUBSPEC=$(find project -name pubspec.yaml -type f \
            -not -path '*/.dart_tool/*' -not -path '*/build/*' \
            -not -path '*/.symlinks/*' -not -path '*/example/*' \
            -not -path '*/.pub-cache/*' -not -path '*/node_modules/*' \
            | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2- || true)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan"
            find project -maxdepth 3 | head -60
            exit 1
          fi
          PROJECT_ROOT=$(cd "$(dirname "$PUBSPEC")" && pwd)
          echo "Flutter project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          # Buang sisa build dari mesin lokal (sering bikin error di CI)
          cd "$PROJECT_ROOT"
          rm -rf .dart_tool build .flutter-plugins .flutter-plugins-dependencies \
                 .packages android/.gradle android/build android/app/build \
                 android/local.properties ios/Pods ios/.symlinks 2>/dev/null || true
          ls -la

      # ----------------------------------------------------------
      # 3. Deteksi versi Flutter & Java yang cocok dengan project
      # ----------------------------------------------------------
      - name: Detect Flutter & Java version
        id: detect
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          FLUTTER_VER=""
          CHANNEL="stable"

          # a) .fvmrc / fvm_config.json (kalau project pakai FVM)
          if [ -f .fvmrc ]; then
            FLUTTER_VER=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('.fvmrc','utf8')).flutter||'')}catch(e){}")
          elif [ -f .fvm/fvm_config.json ]; then
            FLUTTER_VER=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('.fvm/fvm_config.json','utf8')).flutterSdkVersion||'')}catch(e){}")
          fi
          # buang prefix/kanal (mis. "stable" / "3.19.6@stable")
          FLUTTER_VER=$(echo "$FLUTTER_VER" | sed 's/@.*//')
          case "$FLUTTER_VER" in [0-9]*) ;; *) FLUTTER_VER="" ;; esac

          # b) Batas atas Dart SDK < 3.0.0 → project era Dart 2 → Flutter 3.7.x
          if [ -z "$FLUTTER_VER" ]; then
            UPPER=$(grep -A4 '^environment:' pubspec.yaml | grep -E '^\s+sdk:' | head -1 | grep -oE '<\s*[0-9]+' | grep -oE '[0-9]+' || true)
            if [ -n "$UPPER" ] && [ "$UPPER" -le 2 ] 2>/dev/null; then
              FLUTTER_VER="3.7.12"
              echo "pubspec membatasi Dart <3 → pakai Flutter $FLUTTER_VER"
            fi
          fi

          if [ -n "$FLUTTER_VER" ]; then
            echo "flutter_version=$FLUTTER_VER" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_version=" >> "$GITHUB_OUTPUT"
          fi

          # Java: Gradle wrapper < 7.3 tidak jalan di Java 17 → pakai 11
          JAVA_VER=17
          WRAP=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAP" ]; then
            GV=$(grep distributionUrl "$WRAP" | grep -oE 'gradle-[0-9]+\.[0-9]+' | head -1 | sed 's/gradle-//')
            MAJ=${GV%%.*}; MIN=${GV##*.}
            echo "Gradle wrapper: $GV"
            if [ -n "$GV" ] && { [ "$MAJ" -lt 7 ] || { [ "$MAJ" -eq 7 ] && [ "$MIN" -lt 3 ]; }; }; then
              JAVA_VER=11
            fi
          fi
          echo "java_version=$JAVA_VER" >> "$GITHUB_OUTPUT"
          echo "Flutter=${FLUTTER_VER:-stable(latest)} | Java=$JAVA_VER"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.detect.outputs.java_version }}

      - name: Setup Flutter (versi dari project)
        if: steps.detect.outputs.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter_version }}
          cache: true

      - name: Setup Flutter (stable)
        if: steps.detect.outputs.flutter_version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          flutter doctor -v || true

      # ----------------------------------------------------------
      # 4. pub get (+ build_runner hanya jika dipakai)
      # ----------------------------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eo pipefail
          flutter pub get

          if grep -qE '^\s*build_runner\s*:' pubspec.yaml; then
            echo "build_runner terdeteksi → generate code"
            dart run build_runner build --delete-conflicting-outputs 2>&1 | tail -40 || \
              echo "WARNING: build_runner gagal (lanjut, mungkin file hasil generate sudah ada di project)"
          fi

      # ----------------------------------------------------------
      # 5. Siapkan Android + build APK
      # ----------------------------------------------------------
      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -uo pipefail
          BUILD_TYPE=$(node -e "const p=JSON.parse(process.env.PAYLOAD_JSON); console.log((p.buildType||'release').toLowerCase())")
          echo "Build type = $BUILD_TYPE"
          echo "Java: $(java -version 2>&1 | head -1)"

          # --- android/ tidak ada → generate (nama package diambil dari pubspec) ---
          if [ ! -d android ]; then
            PKG=$(grep -E '^name:' pubspec.yaml | head -1 | sed 's/name:[[:space:]]*//' | tr -d '"'"'"' \r')
            echo "android/ tidak ada → flutter create --platforms=android --project-name $PKG"
            flutter create --platforms=android --project-name "$PKG" .
          fi

          # --- local.properties ---
          touch android/local.properties
          sed -i '/^sdk.dir=/d;/^flutter.sdk=/d' android/local.properties
          printf '\nsdk.dir=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> android/local.properties
          FLUTTER_ROOT_DIR=$(dirname "$(dirname "$(which flutter)")")
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT_DIR" >> android/local.properties

          # --- gradle.properties (pastikan akhir file ada newline sebelum append) ---
          GP=android/gradle.properties
          touch "$GP"
          [ -s "$GP" ] && [ "$(tail -c1 "$GP" | wc -l)" -eq 0 ] && echo >> "$GP"
          grep -q '^org.gradle.daemon='  "$GP" || echo "org.gradle.daemon=false" >> "$GP"
          grep -q '^org.gradle.jvmargs=' "$GP" || echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> "$GP"
          grep -q '^android.useAndroidX=' "$GP" || echo "android.useAndroidX=true" >> "$GP"
          grep -q '^android.enableJetifier=' "$GP" || echo "android.enableJetifier=true" >> "$GP"

          # --- key.properties dirujuk build.gradle tapi tidak ada di ZIP ---
          # (file ini biasanya di-.gitignore → tidak ikut ZIP → build release error)
          if grep -qs 'key.properties' android/app/build.gradle android/app/build.gradle.kts \
             && [ ! -f android/key.properties ]; then
            echo "key.properties dirujuk tapi tidak ada → buat debug keystore sementara"
            KS="$PWD/android/ci-debug.keystore"
            keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$KS
          EOF
            # heredoc di dalam YAML punya indentasi → rapikan
            sed -i 's/^[[:space:]]*//' android/key.properties
            cat android/key.properties | sed 's/Password=.*/Password=***/'
          fi

          # --- build ---
          FLAGS="--no-tree-shake-icons"
          if [ "$BUILD_TYPE" = "debug" ]; then MODE="--debug"; else MODE="--release"; fi

          flutter build apk $MODE $FLAGS 2>&1 | tee /tmp/flutter-build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========== BUILD GAGAL — CUPLIKAN ERROR =========="
            grep -n -E "FAILURE:|\* What went wrong:|\* Where:|\* Try:|Error:|BUILD FAILED|Exception|error:|e: " /tmp/flutter-build.log | tail -80 || true
            echo ""
            echo "========== TAIL LOG (80 baris) =========="
            tail -80 /tmp/flutter-build.log || true
            exit "$BUILD_EXIT"
          fi
          echo "Build APK sukses"

      # ----------------------------------------------------------
      # 6. Cari APK + upload artifact (nama HARUS apk-<jobId>)
      # ----------------------------------------------------------
      - name: Locate APK
        run: |
          set -euo pipefail
          ROOT="$PROJECT_ROOT"
          APK=""
          for cand in "$ROOT/build/app/outputs/flutter-apk/app-release.apk" \
                      "$ROOT/build/app/outputs/flutter-apk/app-debug.apk"; do
            [ -f "$cand" ] && APK="$cand" && break
          done
          if [ -z "$APK" ]; then
            # fallback: APK terbesar (hindari *-unaligned / test apk)
            APK=$(find "$ROOT/build" -name '*.apk' -type f -not -name '*unaligned*' -not -name '*androidTest*' \
                  -printf '%s %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: Tidak ada file .apk"
            find "$ROOT/build" -type f 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app-release.apk
          retention-days: 1
          if-no-files-found: error
